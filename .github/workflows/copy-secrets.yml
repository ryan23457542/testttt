name: Copy Secrets (one-time)
on:
  workflow_dispatch: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy build secrets to the new repo
        env:
          GH_TOKEN: ${{ secrets.NEW_REPO_PAT }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::NEW_REPO_PAT secret is missing"; exit 1; fi
          for NAME in API_ID API_HASH KEYSTORE_JKS KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then echo "SKIPPED (empty or missing in old repo): $NAME"; continue; fi
            if printf '%s' "$VALUE" | gh secret set "$NAME" --repo thant393/Kurogram; then
              echo "COPIED: $NAME"
            else
              echo "::error::FAILED: $NAME"
            fi
          done
